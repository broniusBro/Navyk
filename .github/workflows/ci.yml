name: CI

on:
  push:
  pull_request:

jobs:
  content-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build and validate lessons
        run: python3 scripts/build_content.py
      - name: Regenerate course map
        run: python3 scripts/build_course_md.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: server
        run: npm test
