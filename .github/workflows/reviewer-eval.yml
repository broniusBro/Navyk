name: Reviewer eval

# Прогон проверяющего на эталонном наборе через настоящий Claude API.
# Запускается сам при изменении инструкции, рубрики, модели или набора кейсов,
# а также вручную (Actions → Reviewer eval → Run workflow).
# Нужен секрет репозитория ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).

on:
  workflow_dispatch:
  push:
    paths:
      - "content/reviewer/**"
      - "server/src/reviewer/**"
      - "server/src/config/models.json"
      - "server/eval/cases.json"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml && python3 scripts/build_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run eval
        working-directory: server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-eval
          path: server/eval/results/
