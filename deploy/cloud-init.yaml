#cloud-config
# Navyk — автоматическая подготовка сервера Hetzner (Ubuntu 24.04).
# Вставьте этот файл целиком в поле «Cloud config» при создании сервера.
# Сервер сам: обновится, поставит Node.js 22 и Caddy (HTTPS), создаст пользователей,
# включит файрвол и автообновления безопасности. Код приложения приходит из GitHub Actions
# (.github/workflows/deploy.yml) — на сервере ничего вручную делать не нужно.

package_update: true
package_upgrade: true
packages:
  - curl
  - ca-certificates
  - gnupg
  - rsync
  - ufw
  - unattended-upgrades
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https

users:
  - default
  - name: deploy
    gecos: Navyk deploy (GitHub Actions)
    shell: /bin/bash
    lock_passwd: true
  - name: navyk
    gecos: Navyk app runtime
    shell: /usr/sbin/nologin
    system: true
    lock_passwd: true

write_files:
  - path: /etc/systemd/system/navyk.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Navyk web app
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/srv/navyk/server/src/http.ts

      [Service]
      User=navyk
      Group=navyk
      WorkingDirectory=/srv/navyk
      Environment=NODE_ENV=production
      Environment=PORT=8080
      Environment=HOST=127.0.0.1
      Environment=TRUST_PROXY=1
      EnvironmentFile=-/etc/navyk/secrets.env
      ExecStart=/usr/bin/node server/src/http.ts
      Restart=always
      RestartSec=3
      # Hardening
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ReadOnlyPaths=/srv/navyk
      CapabilityBoundingSet=
      MemoryMax=512M

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/navyk-apply
    permissions: "0755"
    content: |
      #!/bin/bash
      # Вызывается GitHub Actions через sudo после выкладки кода.
      # Устанавливает секреты и домен, перезапускает приложение. Только root.
      set -euo pipefail
      IN=/home/deploy/incoming
      if [ -f "$IN/secrets.env" ]; then
        install -o root -g root -m 0600 "$IN/secrets.env" /etc/navyk/secrets.env
        rm -f "$IN/secrets.env"
      fi
      if [ -f "$IN/domain" ]; then
        DOMAIN=$(tr -cd 'a-zA-Z0-9.-' < "$IN/domain")
        rm -f "$IN/domain"
        if [ -n "$DOMAIN" ]; then
          printf '%s {\n\tencode zstd gzip\n\treverse_proxy 127.0.0.1:8080\n}\n' "$DOMAIN" > /etc/caddy/Caddyfile
          systemctl reload caddy || systemctl restart caddy
        fi
      fi
      chmod -R a+rX /srv/navyk
      systemctl daemon-reload
      systemctl enable navyk >/dev/null 2>&1 || true
      systemctl restart navyk
      sleep 2
      systemctl is-active --quiet navyk

  - path: /etc/sudoers.d/navyk-deploy
    permissions: "0440"
    content: |
      deploy ALL=(root) NOPASSWD: /usr/local/bin/navyk-apply

  - path: /etc/ssh/sshd_config.d/60-navyk.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Node.js 22 (NodeSource)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  # Caddy (official repository) — автоматический HTTPS
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy
  # Временный адрес <ip-с-дефисами>.sslip.io с настоящим сертификатом, пока нет своего домена
  - IP=$(curl -fsS http://169.254.169.254/hetzner/v1/metadata/public-ipv4 || curl -fsS https://api.ipify.org)
  - printf '%s.sslip.io {\n\tencode zstd gzip\n\treverse_proxy 127.0.0.1:8080\n}\n' "$(echo "$IP" | tr . -)" > /etc/caddy/Caddyfile
  - systemctl enable --now caddy
  - systemctl reload caddy
  # Папки приложения
  - mkdir -p /srv/navyk /etc/navyk /home/deploy/incoming
  - chown -R deploy:deploy /srv/navyk /home/deploy/incoming
  - chmod 0755 /srv/navyk
  - chmod 0700 /etc/navyk
  # SSH-ключ, указанный при создании сервера, разрешает вход и пользователю deploy
  - mkdir -p /home/deploy/.ssh
  - cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - chown -R deploy:deploy /home/deploy/.ssh
  - chmod 0700 /home/deploy/.ssh
  - chmod 0600 /home/deploy/.ssh/authorized_keys
  - systemctl daemon-reload
  - systemctl restart ssh
  # Файрвол: только SSH и веб
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

final_message: "Navyk server ready after $UPTIME s. Run the Deploy workflow in GitHub Actions."
