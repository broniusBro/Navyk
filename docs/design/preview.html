svg><\/button><div class=\"phrase__text\"><span class=\"phrase__pl\" lang=\"pl\">Na wynos czy na miejscu?<\/span><span class=\"phrase__ru\">С собой или здесь?<\/span><\/div><\/li><\/ul>\n<blockquote>Похоже на русский «прошу», но ударение — всегда на предпоследний слог: po-<b>PRO<\/b>-szę.<\/blockquote><\/div><\/section><\/main>\n<button class=\"helper-fab\"><span class=\"ai-avatar ai-avatar--tutor\"><\/span><svg viewBox=\"0 0 24 24\" class=\"icon helper-fab__icon\" aria-hidden=\"true\"><path d=\"M12 3c.6 4.5 2.5 6.4 7 7-4.5.6-6.4 2.5-7 7-.6-4.5-2.5-6.4-7-7 4.5-.6 6.4-2.5 7-7zM18.5 16c.3 1.6.9 2.2 2.5 2.5-1.6.3-2.2.9-2.5 2.5-.3-1.6-.9-2.2-2.5-2.5 1.6-.3 2.2-.9 2.5-2.5z\"/><\/svg><span class=\"helper-fab__label\">Спросить<\/span><\/button>\n<footer class=\"lesson__bar\"><div class=\"lesson__actions\"><button class=\"btn btn--primary btn--wide\">Дальше<\/button><\/div><\/footer><\/div>", "tiles": "<div class=\"lesson\"><header class=\"lesson__top\"><button class=\"icon-btn lesson__close\"><svg viewBox=\"0 0 24 24\" class=\"icon\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n<div class=\"progress\"><div class=\"progress__fill\" style=\"transform:translateX(-48%)\"><\/div><\/div><\/header><main class=\"lesson__stage\"><section class=\"ex is-correct\" data-type=\"build_sentence\">\n<p class=\"ex__tag\">Собери фразу<\/p><h2 class=\"ex__question\">Переведи на польский<\/h2>\n<div class=\"tiles\"><p class=\"tiles__translation\"><button class=\"audio-btn\"><svg viewBox=\"0 0 24 24\" class=\"icon\" aria-hidden=\"true\"><path d=\"M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11\"/><\/svg><\/button><span>Мне, пожалуйста, большой капучино.<\/span><\/p>\n<div class=\"tiles__answer\"><button class=\"tile tile--ok\" lang=\"pl\">Poproszę<\/button><button class=\"tile tile--ok\" lang=\"pl\">duże<\/button><button class=\"tile tile--ok\" lang=\"pl\">cappuccino<\/button><\/div>\n<div class=\"tiles__bank\"><button class=\"tile is-u
