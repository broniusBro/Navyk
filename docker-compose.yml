# brolingvo · polski on the shared application server (see bronus-core/host/README.md).
# Own "apartment": Compose project "brolingvo-poland", port 127.0.0.1:8120 (registered in /etc/host/projects),
# secrets /etc/brolingvo-poland/brolingvo-poland.env (ANTHROPIC_API_KEY, EMAIL_PROVIDER, EMAIL_API_KEY, PUBLIC_ORIGIN ...).
# Accounts database: named volume brolingvo-poland-data → /data/brolingvo.sqlite (daily copies: deploy/backup.sh).
name: brolingvo-poland

services:
  app:
    build: .
    image: brolingvo-poland:latest
    restart: unless-stopped
    env_file: /etc/brolingvo-poland/brolingvo-poland.env
    environment:
      DATA_DIR: /data
    volumes:
      - brolingvo-poland-data:/data
    # only reachable from the server itself; Caddy terminates HTTPS
    ports:
      - "127.0.0.1:${APP_PORT:-8120}:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    stop_grace_period: 15s

volumes:
  brolingvo-poland-data:
